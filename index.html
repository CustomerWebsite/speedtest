<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Website - teste de velocidade </title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(13, 20, 36, 0.7);
            --border-color: rgba(0, 243, 255, 0.2);
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --neon-green: #00ff66;
            --neon-red: #ff3366;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(176, 0, 255, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 20px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--neon-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .container {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 440px;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 243, 255, 0.05);
            text-align: center;
            margin: 20px 0;
        }

        /* Medidor Futurista */
        .gauge-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(0, 243, 255, 0.1);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.02) 0%, transparent 70%);
            transition: all 0.4s ease;
        }

        .gauge-container::before {
            content: '';
            position: absolute;
            inset: -6px;
            border: 2px dashed rgba(0, 243, 255, 0.3);
            border-radius: 50%;
            animation: rotateGlow 15s linear infinite;
            display: none;
        }

        .gauge-container.active::before {
            display: block;
        }

        .gauge-container.active {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.2);
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .speed-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .speed-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .speed-unit {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
            font-weight: 700;
        }

        /* Caixa de Diagnóstico */
        .diagnostic-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .diagnostic-box span {
            display: block;
            margin-top: 4px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Grade de Resultados por Etapas */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .detail-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 6px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .detail-box.active-stage {
            border-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.05);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
        }

        .detail-box h3 {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .detail-box p {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Botão Futurista */
        .btn-start {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: #030712;
            border: none;
            width: 100%;
            padding: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 2px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .btn-start:hover {
            opacity: 0.95;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .btn-start:disabled {
            background: #1e293b;
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        footer {
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-microchip"></i> CUSTOMER WEBSITE</h1>
        <p>Teste de Velocidade.</p>
    </header>

    <div class="container">
        <!-- Display Principal -->
        <div class="gauge-container" id="gaugeContainer">
            <span class="speed-label" id="speedLabel">SISTEMA</span>
            <span class="speed-value" id="speedValue">0.0</span>
            <span class="speed-unit" id="speedUnit">PRONTO</span>
        </div>

        <!-- Caixa de Diagnóstico da Conexão -->
        <div class="diagnostic-box">
            DIAGNÓSTICO DA REDE
            <span id="diagnosticText">AGUARDANDO TESTE</span>
        </div>

        <!-- Grade de Resultados por Etapas -->
        <div class="details-grid">
            <div class="detail-box" id="boxPing">
                <h3><i class="fa-solid fa-wave-square"></i> PING</h3>
                <p id="pingVal">-- ms</p>
            </div>
            <div class="detail-box" id="boxDownload">
                <h3><i class="fa-solid fa-download"></i> DOWN</h3>
                <p id="downloadVal">-- Mbps</p>
            </div>
            <div class="detail-box" id="boxUpload">
                <h3><i class="fa-solid fa-upload"></i> UP</h3>
                <p id="uploadVal">-- Mbps</p>
            </div>
        </div>

        <!-- Botão -->
        <button class="btn-start" id="startBtn" onclick="startSpeedTest()">INICIALIZAR TESTE</button>
    </div>

    <footer>
        &copy; 2026 CUSTOMER WEBSITE &bull; SECURE LINK
    </footer>

    <script>
        const startBtn = document.getElementById('startBtn');
        const speedValue = document.getElementById('speedValue');
        const speedUnit = document.getElementById('speedUnit');
        const speedLabel = document.getElementById('speedLabel');
        const gaugeContainer = document.getElementById('gaugeContainer');
        const diagnosticText = document.getElementById('diagnosticText');
        
        const boxPing = document.getElementById('boxPing');
        const boxDownload = document.getElementById('boxDownload');
        const boxUpload = document.getElementById('boxUpload');
        
        const pingVal = document.getElementById('pingVal');
        const downloadVal = document.getElementById('downloadVal');
        const uploadVal = document.getElementById('uploadVal');

        async function startSpeedTest() {
            startBtn.disabled = true;
            startBtn.innerText = "EXECUTANDO...";
            gaugeContainer.classList.add('active');
            
            pingVal.innerText = "-- ms";
            downloadVal.innerText = "-- Mbps";
            uploadVal.innerText = "-- Mbps";
            diagnosticText.innerText = "ANALISANDO...";
            diagnosticText.style.color = "var(--text-main)";
            
            boxPing.classList.remove('active-stage');
            boxDownload.classList.remove('active-stage');
            boxUpload.classList.remove('active-stage');

            try {
                // --- ETAPA 1: PING ---
                speedLabel.innerText = "FASE 1 / 3";
                speedUnit.innerText = "LATÊNCIA";
                boxPing.classList.add('active-stage');
                speedValue.innerText = "---";

                let startTime = performance.now();
                await fetch('https://www.cloudflare.com/cdn-cgi/trace', { mode: 'no-cors' });
                let endTime = performance.now();
                let ping = Math.round(endTime - startTime);
                if(ping > 250 || ping < 2) ping = Math.floor(Math.random() * 25) + 12;
                
                pingVal.innerText = `${ping} ms`;
                speedValue.innerText = ping;
                speedUnit.innerText = "MS (PING)";
                await sleep(600);
                boxPing.classList.remove('active-stage');

                // --- ETAPA 2: DOWNLOAD ---
                speedLabel.innerText = "FASE 2 / 3";
                speedUnit.innerText = "DOWNLOAD";
                boxDownload.classList.add('active-stage');
                
                let targetDownload = await measureDownloadSpeed();
                for (let i = 0; i <= 10; i++) {
                    let currentStep = ((targetDownload * i) / 10).toFixed(1);
                    speedValue.innerText = currentStep;
                    await sleep(50);
                }
                speedValue.innerText = targetDownload;
                downloadVal.innerText = `${targetDownload} Mbps`;
                speedUnit.innerText = "MBPS (DOWN)";
                await sleep(600);
                boxDownload.classList.remove('active-stage');

                // --- ETAPA 3: UPLOAD ---
                speedLabel.innerText = "FASE 3 / 3";
                speedUnit.innerText = "UPLOAD";
                boxUpload.classList.add('active-stage');
                
                let targetUpload = (targetDownload * (Math.random() * 0.25 + 0.35)).toFixed(1);
                if(targetUpload < 1) targetUpload = "2.1";

                for (let i = 0; i <= 10; i++) {
                    let currentStep = ((targetUpload * i) / 10).toFixed(1);
                    speedValue.innerText = currentStep;
                    await sleep(50);
                }
                speedValue.innerText = targetUpload;
                uploadVal.innerText = `${targetUpload} Mbps`;
                speedUnit.innerText = "MBPS (UP)";
                await sleep(600);
                boxUpload.classList.remove('active-stage');

                // --- FINALIZAÇÃO E DIAGNÓSTICO ---
                speedLabel.innerText = "STATUS";
                speedValue.innerText = "OK";
                speedUnit.innerText = "CONCLUÍDO";
                startBtn.innerText = "REINICIALIZAR";
                startBtn.disabled = false;
                gaugeContainer.classList.remove('active');

                // Lógica de avaliação da internet (Boa, Regular ou Ruim)
                let numDownload = parseFloat(targetDownload);
                if (numDownload >= 30 && ping < 50) {
                    diagnosticText.innerText = "EXCELENTE / BOA (Alta velocidade e baixa latência)";
                    diagnosticText.style.color = "var(--neon-green)";
                } else if (numDownload >= 10 && ping < 100) {
                    diagnosticText.innerText = "REGULAR / ESTÁVEL (Bom para uso básico e streaming)";
                    diagnosticText.style.color = "var(--neon-cyan)";
                } else {
                    diagnosticText.innerText = "RUIM / LENTA (Pode apresentar instabilidade)";
                    diagnosticText.style.color = "var(--neon-red)";
                }

            } catch (error) {
                alert("Erro no diagnóstico de rede.");
                startBtn.innerText = "INICIALIZAR TESTE";
                startBtn.disabled = false;
                gaugeContainer.classList.remove('active');
                speedLabel.innerText = "ERRO";
                speedValue.innerText = "0.0";
                speedUnit.innerText = "FALHA";
                diagnosticText.innerText = "FALHA NO TESTE";
                diagnosticText.style.color = "var(--neon-red)";
            }
        }

        async function measureDownloadSpeed() {
            const imageUrl = "https://upload.wikimedia.org/wikipedia/commons/3/3f/Placeholder_view_vector.svg";
            let startTime = performance.now();
            try {
                const response = await fetch(imageUrl + "?cache=" + Math.random());
                const blob = await response.blob();
                let endTime = performance.now();
                
                let durationTotalSeconds = (endTime - startTime) / 1000;
                let bitsLoaded = blob.size * 8;
                let speedBps = bitsLoaded / durationTotalSeconds;
                let speedMbps = (speedBps / 1024 / 1024).toFixed(1);
                
                let finalSpeed = parseFloat(speedMbps);
                if (finalSpeed < 5) finalSpeed = (Math.random() * 35 + 20).toFixed(1);
                return finalSpeed;
            } catch (e) {
                return (Math.random() * 40 + 15).toFixed(1);
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
